openapi: 3.1.0
info:
  title: Garbh Journey — Gita Audio API
  description: |
    REST API and audio streaming backend for **Garbh Journey**, a mobile pregnancy (Garbh Sanskar) app whose core content is the **Bhagavad Gita**: 18 chapters, 700 shloks, with Sanskrit audio recitation, Devanagari text, transliteration, maternal explanations, pregnancy timeline mapping, and non-guilt streak tracking.
  version: 1.0.0
  contact:
    name: Garbh Journey Team
    email: dev@garbhjourney.com

servers:
  - url: http://localhost:8000/api/v1
    description: Local development server
  - url: https://api.garbhjourney.com/api/v1
    description: Production API server

tags:
  - name: Health
    description: Liveness and database readiness probes.
  - name: Auth
    description: Registration, authentication, token rotation, and logout.
  - name: Profile
    description: Current user profile, pregnancy dates, favorites, progress, and streak.
  - name: Library
    description: 18 chapters, themes, summaries, topics, and playlists.
  - name: Shloks
    description: Detailed verse screen with Devanagari, transliteration, meanings, and audio.
  - name: Search
    description: Full-text search across Sanskrit Devanagari, transliteration, and meanings.
  - name: Pregnancy
    description: 40-week Garbh Sanskar timeline, themes, and recommended shloks.
  - name: Daily Sanskar
    description: Today's personalized shlok, maternal reflection, and completion.
  - name: Audio & Manifest
    description: Audio track manifests for offline downloading and reciter metadata.
  - name: Admin
    description: Administrative and editorial management (requires is_admin flag).

paths:
  /health:
    get:
      tags:
        - Health
      summary: Liveness check
      description: Returns 200 if the FastAPI application process is up and running.
      operationId: health_check
      responses:
        '200':
          description: Service is healthy.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /health/ready:
    get:
      tags:
        - Health
      summary: Readiness check
      description: Verifies active database connection and query readiness.
      operationId: readiness_check
      responses:
        '200':
          description: Database is connected and ready.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthReadyResponse'

  /auth/register:
    post:
      tags:
        - Auth
      summary: Register a new user
      operationId: register_user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: User registered successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Email already registered or invalid inputs.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      tags:
        - Auth
      summary: Authenticate with email and password
      operationId: login_user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid email or password.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      tags:
        - Auth
      summary: Rotate refresh token
      operationId: refresh_token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Tokens refreshed successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Refresh token invalid or revoked.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/logout:
    post:
      tags:
        - Auth
      summary: Revoke refresh token
      operationId: logout_user
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Successfully logged out.
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me:
    get:
      tags:
        - Profile
      summary: Get current user profile
      operationId: get_me
      security:
        - BearerAuth: []
      responses:
        '200':
          description: User profile details.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags:
        - Profile
      summary: Update user profile
      operationId: update_me
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdateRequest'
      responses:
        '200':
          description: Updated profile.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /me/favorites:
    get:
      tags:
        - Profile
      summary: List user's favorited shloks
      operationId: list_favorites
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteListResponse'

  /me/favorites/{shlok_id}:
    put:
      tags:
        - Profile
      summary: Add shlok to favorites (idempotent)
      operationId: add_favorite
      security:
        - BearerAuth: []
      parameters:
        - name: shlok_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FavoriteResponse'
    delete:
      tags:
        - Profile
      summary: Remove shlok from favorites (idempotent)
      operationId: remove_favorite
      security:
        - BearerAuth: []
      parameters:
        - name: shlok_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '204':
          description: Shlok unfavorited.

  /me/progress/{shlok_id}:
    put:
      tags:
        - Profile
      summary: Record playback progress
      operationId: record_progress
      security:
        - BearerAuth: []
      parameters:
        - name: shlok_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProgressUpdateRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProgressResponse'

  /me/progress:
    get:
      tags:
        - Profile
      summary: Per-chapter progress summary
      operationId: get_chapter_progress
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ChapterProgressResponse'

  /me/streak:
    get:
      tags:
        - Profile
      summary: User practice streak stats
      operationId: get_streak
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StreakResponse'

  /me/sanskar-log:
    get:
      tags:
        - Profile
      summary: Unified Sanskar memory log
      operationId: get_sanskar_log
      security:
        - BearerAuth: []
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SanskarLogResponse'

  /chapters:
    get:
      tags:
        - Library
      summary: List all 18 chapters
      operationId: list_chapters
      parameters:
        - name: topic
          in: query
          description: Filter by topic slug
          schema:
            type: string
        - name: lang
          in: query
          description: Language code ('en' or 'hi')
          schema:
            type: string
            default: en
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterListResponse'

  /chapters/featured:
    get:
      tags:
        - Library
      summary: Get featured chapter
      operationId: get_featured_chapter
      parameters:
        - name: week
          in: query
          description: Pregnancy week (1-40)
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeaturedChapterResponse'

  /chapters/{n}:
    get:
      tags:
        - Library
      summary: Get chapter detail
      operationId: get_chapter_detail
      parameters:
        - name: n
          in: path
          required: true
          schema:
            type: integer
        - name: lang
          in: query
          schema:
            type: string
            default: en
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterResponse'

  /chapters/{n}/shloks:
    get:
      tags:
        - Library
      summary: Get paginated shloks for a chapter
      operationId: get_chapter_shloks
      parameters:
        - name: n
          in: path
          required: true
          schema:
            type: integer
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: lang
          in: query
          schema:
            type: string
            default: en
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ShlokBrief'

  /chapters/{n}/playlist:
    get:
      tags:
        - Library
      summary: Get audio playlist for chapter
      operationId: get_chapter_playlist
      parameters:
        - name: n
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PlaylistTrackResponse'

  /shloks/{chapter}/{verse}:
    get:
      tags:
        - Shloks
      summary: Get full shlok screen payload
      operationId: get_shlok_detail
      parameters:
        - name: chapter
          in: path
          required: true
          schema:
            type: integer
        - name: verse
          in: path
          required: true
          schema:
            type: integer
        - name: lang
          in: query
          schema:
            type: string
            default: en
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ShlokDetailResponse'

  /topics:
    get:
      tags:
        - Library
      summary: List all topics
      operationId: list_topics
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TopicResponse'

  /search:
    get:
      tags:
        - Search
      summary: Search shloks and chapters
      operationId: search_gita
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
        - name: lang
          in: query
          schema:
            type: string
            default: en
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResultResponse'

  /weeks:
    get:
      tags:
        - Pregnancy
      summary: List 40 pregnancy weeks
      operationId: list_weeks
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/WeekBrief'

  /weeks/{n}:
    get:
      tags:
        - Pregnancy
      summary: Get pregnancy week detail
      operationId: get_week_detail
      parameters:
        - name: n
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeekDetailResponse'

  /daily-sanskar:
    get:
      tags:
        - Daily Sanskar
      summary: Get today's daily sanskar
      operationId: get_daily_sanskar
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailySanskarResponse'

  /sanskar/complete:
    post:
      tags:
        - Daily Sanskar
      summary: Mark today's sanskar as completed
      operationId: complete_sanskar
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SanskarCompleteRequest'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SanskarCompleteResponse'

  /manifest/chapters/{n}:
    get:
      tags:
        - Audio & Manifest
      summary: Chapter audio manifest
      operationId: get_chapter_manifest
      parameters:
        - name: n
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManifestResponse'

  /manifest/weeks/{n}:
    get:
      tags:
        - Audio & Manifest
      summary: Week audio manifest
      operationId: get_week_manifest
      parameters:
        - name: n
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManifestResponse'

  /reciters:
    get:
      tags:
        - Audio & Manifest
      summary: List reciters
      operationId: list_reciters
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReciterResponse'

  /admin/chapters/{n}/theme:
    put:
      tags:
        - Admin
      summary: Update chapter maternal theme
      operationId: update_chapter_theme
      security:
        - BearerAuth: []
      parameters:
        - name: n
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                maternal_theme_en:
                  type: string
                maternal_theme_hi:
                  type: string
                recommended_trimester:
                  type: integer
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChapterResponse'

  /admin/audio/rescan:
    post:
      tags:
        - Admin
      summary: Rescan audio directory
      operationId: rescan_audio
      security:
        - BearerAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  message:
                    type: string
                  scanned_files:
                    type: integer
                  updated_tracks:
                    type: integer

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  responses:
    Unauthorized:
      description: Authentication required or token invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    HealthResponse:
      type: object
      required:
        - status
        - version
      properties:
        status:
          type: string
          example: "ok"
        version:
          type: string
          example: "1.0.0"

    HealthReadyResponse:
      type: object
      required:
        - status
        - database
        - version
      properties:
        status:
          type: string
          example: "ok"
        database:
          type: string
          example: "connected"
        version:
          type: string
          example: "1.0.0"

    ErrorDetail:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: "NOT_FOUND"
        message:
          type: string
          example: "The requested resource was not found."

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          $ref: '#/components/schemas/ErrorDetail'

    RegisterRequest:
      type: object
      required:
        - email
        - password
        - display_name
      properties:
        email:
          type: string
          format: email
          example: "mother@example.com"
        password:
          type: string
          format: password
          minLength: 8
          example: "SuperSecurePass123"
        display_name:
          type: string
          example: "Ananya Sharma"

    LoginRequest:
      type: object
      required:
        - email
        - password
      properties:
        email:
          type: string
          format: email
          example: "mother@example.com"
        password:
          type: string
          format: password
          example: "SuperSecurePass123"

    RefreshRequest:
      type: object
      required:
        - refresh_token
      properties:
        refresh_token:
          type: string
          example: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9..."

    TokenResponse:
      type: object
      required:
        - access_token
        - refresh_token
        - token_type
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: "bearer"

    UserResponse:
      type: object
      required:
        - id
        - email
        - display_name
        - preferred_lang
        - timezone
      properties:
        id:
          type: integer
          example: 1
        email:
          type: string
          format: email
          example: "mother@example.com"
        display_name:
          type: string
          example: "Ananya"
        preferred_lang:
          type: string
          example: "hi"
        pregnancy_start_date:
          type: string
          format: date
          nullable: true
          example: "2026-03-01"
        due_date:
          type: string
          format: date
          nullable: true
          example: "2026-12-07"
        timezone:
          type: string
          example: "Asia/Kolkata"

    UserUpdateRequest:
      type: object
      properties:
        display_name:
          type: string
        preferred_lang:
          type: string
        pregnancy_start_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
        timezone:
          type: string

    AudioTrackResponse:
      type: object
      required:
        - track_id
        - title
        - url
        - duration_sec
        - size_bytes
        - version
      properties:
        track_id:
          type: integer
          example: 123
        title:
          type: string
          example: "Samatvam Yoga Meditation"
        subtitle:
          type: string
          nullable: true
          example: "Sanskrit Recitation with Warm Tanpura"
        url:
          type: string
          format: uri
          example: "http://localhost:8000/audio/ch02/sl47.mp3"
        duration_sec:
          type: number
          example: 31.5
        size_bytes:
          type: integer
          example: 252000
        version:
          type: integer
          example: 1
        peaks:
          type: array
          items:
            type: number
          nullable: true
          example: [0.1, 0.4, 0.8]

    ShlokBrief:
      type: object
      required:
        - chapter
        - verse
        - reference
        - sanskrit
        - transliteration
        - has_audio
      properties:
        chapter:
          type: integer
          example: 2
        verse:
          type: integer
          example: 47
        reference:
          type: string
          example: "2.47"
        sanskrit:
          type: string
          example: "कर्मण्येवाधिकारस्ते मा फलेषु कदाचन..."
        transliteration:
          type: string
          example: "karmaṇy-evādhikāras te mā phaleṣu kadācana..."
        has_audio:
          type: boolean
          example: true

    ShlokContentResponse:
      type: object
      required:
        - lang
      properties:
        lang:
          type: string
          example: "hi"
        literal_meaning:
          type: string
          nullable: true
        simple_explanation:
          type: string
          nullable: true
        reflection_prompt:
          type: string
          nullable: true
        bonding_practice:
          type: string
          nullable: true

    ProgressResponse:
      type: object
      required:
        - last_position_sec
        - completed
        - listen_count
      properties:
        last_position_sec:
          type: number
          example: 15.2
        completed:
          type: boolean
          example: true
        listen_count:
          type: integer
          example: 3
        last_listened_at:
          type: string
          format: date-time
          nullable: true

    ShlokDetailResponse:
      type: object
      required:
        - chapter
        - verse
        - reference
        - sanskrit
        - transliteration
      properties:
        chapter:
          type: integer
          example: 2
        verse:
          type: integer
          example: 47
        reference:
          type: string
          example: "2.47"
        sanskrit:
          type: string
          example: "कर्मण्येवाधिकारस्ते मा फलेषु कदाचन।\nमा कर्मफलहेतुर्भूर्मा ते सङ्गोऽस्त्वकर्मणि॥"
        transliteration:
          type: string
          example: "karmaṇy-evādhikāras te mā phaleṣu kadācana |\nmā karma-phala-hetur bhūr mā te saṅgo 'stv akarmaṇi ||"
        content:
          $ref: '#/components/schemas/ShlokContentResponse'
        audio:
          $ref: '#/components/schemas/AudioTrackResponse'
          nullable: true
        is_favorite:
          type: boolean
          nullable: true
          example: false
        progress:
          $ref: '#/components/schemas/ProgressResponse'
          nullable: true

    ChapterResponse:
      type: object
      required:
        - id
        - number
        - name_sanskrit
        - name_transliterated
        - name_en
        - verses_count
      properties:
        id:
          type: integer
          example: 2
        number:
          type: integer
          example: 2
        name_sanskrit:
          type: string
          example: "साङ्ख्ययोग"
        name_transliterated:
          type: string
          example: "Sankhya Yoga"
        name_en:
          type: string
          example: "The Yoga of Knowledge"
        verses_count:
          type: integer
          example: 72
        summary_en:
          type: string
          nullable: true
        summary_hi:
          type: string
          nullable: true
        maternal_theme_en:
          type: string
          nullable: true
          example: "Eternal Soul & Steady Calm"
        maternal_theme_hi:
          type: string
          nullable: true
          example: "अविनाशी चेतना और स्थितप्रज्ञ की शांति"
        recommended_trimester:
          type: integer
          nullable: true
          example: 1

    ChapterListResponse:
      type: object
      required:
        - chapters
        - total
      properties:
        chapters:
          type: array
          items:
            $ref: '#/components/schemas/ChapterResponse'
        total:
          type: integer
          example: 18

    FeaturedChapterResponse:
      type: object
      required:
        - chapter
        - reason
      properties:
        chapter:
          $ref: '#/components/schemas/ChapterResponse'
        reason:
          type: string
          example: "Recommended for week 18 focusing on Dhriti (inner steadfastness)."

    TopicResponse:
      type: object
      required:
        - id
        - slug
        - name_en
        - name_hi
      properties:
        id:
          type: integer
        slug:
          type: string
