services:
  # ---------------------------------------------------------------------------
  # FastAPI Web Service
  # ---------------------------------------------------------------------------
  - type: web
    name: gita-audio-api
    runtime: python
    buildCommand: "./deploy/render_build.sh"
    startCommand: "gunicorn app.main:app -w 4 -k uvicorn.workers.UvicornWorker --bind 0.0.0.0:$PORT"
    healthCheckPath: "/health/ready"
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.0"
      - key: ENV
        value: "production"
      - key: AUDIO_ROOT
        value: "data"
      - key: AUDIO_BASE_URL
        fromService:
          type: web
          name: gita-audio-api
          property: host
        transform: "https://${host}/audio"
      - key: DATABASE_URL
        fromDatabase:
          name: gita-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_MINUTES
        value: "60"
      - key: REFRESH_TOKEN_DAYS
        value: "30"
      - key: CORS_ORIGINS
        value: '["*"]'

# ---------------------------------------------------------------------------
# Managed PostgreSQL Database
# ---------------------------------------------------------------------------
databases:
  - name: gita-db
    databaseName: gita
    user: gita_user
    plan: starter # Change to free if testing on free tier
    postgresMajorVersion: 16
